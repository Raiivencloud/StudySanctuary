# Cloud Run Service Blueprint for Study Sanctuary
# This file defines the infrastructure-as-code for cost optimization.
# To deploy: gcloud run services replace cloud-run.yaml

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: study-sanctuary
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Cost Optimization: Scale to zero when idle
        autoscaling.knative.dev/minScale: "0"
        # Cost Optimization: Limit maximum instances to prevent runaway costs
        autoscaling.knative.dev/maxScale: "1"
        # Performance: Enable startup CPU boost for faster cold starts (optional, but recommended for minScale: 0)
        run.googleapis.com/startup-cpu-boost: "true"
        # Cost Optimization: CPU is only allocated during request processing
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/study-sanctuary
        ports:
        - containerPort: 3000
        resources:
          limits:
            # Minimal resources for cost efficiency
            cpu: "1000m" # 1 vCPU
            memory: "512Mi"
        env:
        - name: NODE_ENV
          value: "production"
        # Add other environment variables here
